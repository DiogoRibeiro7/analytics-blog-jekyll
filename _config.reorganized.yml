# ==============================================================================
# DATALOG JEKYLL THEME CONFIGURATION
# ==============================================================================
# Complete configuration reference: docs/configuration-reference.md
# Configuration refactoring plan: docs/config-refactoring-plan.md
# ==============================================================================

# ==============================================================================
# SECTION 1: REQUIRED JEKYLL CORE SETTINGS
# ==============================================================================
# These settings are required for Jekyll to build your site.
# Only modify if you understand Jekyll's configuration requirements.
# ------------------------------------------------------------------------------

# Site identity
name: DataLog
locale: en_US
title: DataLog | Data Science & Research Theme
email: diogo.debastos.ribeiro@gmail.com
description: >-
  DataLog is a clean and academic-inspired Jekyll theme crafted for
  data scientists, researchers, and technical writers who want to share
  reproducible analyses, research papers, tutorials, datasets, and project portfolios.

# URL configuration
url: "https://diogoribeiro7.github.io"
baseurl: ""
theme_version: 0.2.0

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  math_engine: mathjax
  smart_quotes: ["apos", "apos", "quot", "quot"]
  syntax_highlighter_opts:
    block:
      line_numbers: true
highlighter: rouge

# URL structure
permalink: pretty
paginate: 10
paginate_path: "/blog/page:num/"
timezone: Europe/Lisbon

# Content collections
collections:
  portfolio:
    output: true
    permalink: /portfolio/:name/
  datasets:
    output: true
    permalink: /datasets/:name/
  notebooks:
    output: true
    permalink: /notebooks/:name/
  packages:
    output: true
    permalink: /packages/:name/

# Directory structure
includes_dir: _includes
layouts_dir: _layouts
include:
  - _pages
sass:
  sass_dir: _sass
  style: compressed

# Jekyll plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-jupyter-notebook
  - jekyll-include-cache

# Default front matter
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      toc: true
      toc_label: On this page
      author: Diogo Ribeiro
      mathjax: true
  - scope:
      path: ""
      type: "portfolio"
    values:
      layout: portfolio
      hero_image: /assets/img/portfolio-placeholder.svg
  - scope:
      path: ""
      type: "datasets"
    values:
      layout: dataset
      download_button: true
  - scope:
      path: "_pages"
    values:
      layout: page

# Build exclusions
exclude:
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
  - scripts
  - lib
  - docs/site
  - Gemfile
  - node_modules/
  - vendor/
  - .bundle/
  - lib/
  - bin/
  - datalog-theme.gemspec
  - "*.gemspec"
  - script/
  - tmp/

# ==============================================================================
# SECTION 2: SITE IDENTITY & BRANDING
# ==============================================================================
# Customize your site's visual identity and messaging.
# ------------------------------------------------------------------------------

brand:
  tagline: "Transform data into impactful stories and reproducible research."
  accent_symbol: "∀ data · Σ insights"

# SEO metadata
seo:
  type: "ResearchProject"
  name: "DataLog"
  description: "Jekyll theme for data science and research communication"

# Social media defaults
social:
  twitter: datalog_theme
  github: DiogoRibeiro7
  linkedin: diogoribeiro
  default_image: /assets/img/social-card.png

# ==============================================================================
# SECTION 3: AUTHOR PROFILE
# ==============================================================================
# Your professional profile, credentials, and social links.
# For multiple authors, consider using _data/authors.yml (future enhancement).
# ------------------------------------------------------------------------------

author:
  name: Diogo Ribeiro
  affiliation: ESMAD - Instituto Politécnico do Porto
  email: dfr@esmad.ipp.pt
  professional_email: dfr@esmad.ipp.pt

  # Academic/professional profiles
  orcid: https://orcid.org/0009-0001-2022-7072
  google_scholar: "" # Optional: Add your Google Scholar profile URL (see docs/google-scholar-setup.md)
  researchgate: https://www.researchgate.net/profile/Diogo-Ribeiro

  # Social profiles
  github: DiogoRibeiro7
  twitter: DiogoRibeiro7
  linkedin: diogoribeiro
  kaggle: diogoribeiro

  # Bio and research interests
  biography: Data-driven researcher focused on reproducible analytics and thoughtful storytelling.
  research_areas:
    - Machine Learning
    - Statistical Inference
    - Reproducible Research
  methodologies:
    - Experimental Design
    - Bayesian Modeling
    - Exploratory Data Analysis

# Additional contact methods
contact_email: diogo.debastos.ribeiro@gmail.com
contact:
  collaboration: diogo.debastos.ribeiro@gmail.com
  media: dfr@esmad.ipp.pt

# ==============================================================================
# SECTION 4: THEME FEATURES (CORE)
# ==============================================================================
# Enable or disable major theme capabilities.
# All features are optional and can be toggled independently.
# ------------------------------------------------------------------------------

features:
  mathjax: true
  math_toolkit: true
  math_search: true
  search: true
  accessibility_skip_link: true
  dark_mode_toggle: true
  notebook_support: true
  portfolio: true
  datasets: true
  visualizations: true
  academic_dashboard: true
  citation_tracking: true
  academic_calendar: true

# ==============================================================================
# SECTION 5: THEME CUSTOMIZATION
# ==============================================================================
# Visual design, typography, and advanced theme options.
# See docs/customization-guide.md for detailed explanations.
# ------------------------------------------------------------------------------

theme_options:
  academic:
    color_schemes:
      light: "#0b1d3d"
      dark: "#f5f7ff"
      accent: "#3277f6"
    typography:
      body: "Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      headings: "Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      code: "'Fira Code', 'Source Code Pro', monospace"
    layout:
      max_width: 80rem
      column_gap: 2.5rem

  math:
    engine: mathjax
    output: chtml
    equation_numbering: true
    accessibility: true
    render_on_load: true
    katex_cdn: https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/
    mathjax_cdn: https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js

  syntax_highlighting:
    engine: prism
    cdn: https://cdn.jsdelivr.net/npm/prismjs@1.29.0
    themes:
      light: prism-coy
      dark: prism-tomorrow
    components:
      - core
      - python
      - r
      - sql
      - julia
      - javascript
    language_overrides:
      python: prism-coy
      r: prism-okaidia
      sql: prism-twilight
      julia: prism-atom-dark
      javascript: prism-material-oceanic

  visualizations:
    responsive: true
    lazy_load: true
    plotly:
      version: 2.27.0
      mode_bar: true
    d3:
      version: 7
      csp_compliant: true
    observable:
      trusted_domains:
        - https://observablehq.com
    bokeh:
      resources: cdn
    shiny:
      iframe_title: "Embedded R Shiny application"

  taxonomy:
    research_areas: &research_areas
      - id: machine-learning
        title: Machine Learning
        url: /tags/machine-learning/
      - id: statistics
        title: Statistics
        url: /tags/statistics/
      - id: visualization
        title: Data Visualization
        url: /tags/visualization/
      - id: reproducibility
        title: Reproducible Research
        url: /tags/reproducibility/
    methodologies: &methodologies
      - id: experimental-design
        title: Experimental Design
        url: /tags/experimental-design/
      - id: bayesian
        title: Bayesian Modeling
        url: /tags/bayesian/
      - id: eda
        title: Exploratory Data Analysis
        url: /tags/eda/

  localization:
    default_locale: en
    locales:
      - code: en
        label: English
        url: /
    rtl_locales:
      - ar
      - he

  filters:
    languages:
      - label: Python
        url: /tags/python/
      - label: R
        url: /tags/r/
      - label: SQL
        url: /tags/sql/
      - label: Julia
        url: /tags/julia/
      - label: JavaScript
        url: /tags/javascript/
      - label: Scala
        url: /tags/scala/

  datasets:
    default_license: CC-BY-4.0
    availability_statement: "Datasets include licensing, provenance, and methodological notes."

  projects:
    default_repository: DiogoRibeiro7/analytics-blog-jekyll
    showcase_tags:
      - predictive-modeling
      - experimental-design
      - visualization

  publications:
    bibtex_source: assets/publications/publications.bib
    sort_order: descending
    group_by: year
    include_bibliography: true
    export_formats:
      - bibtex
      - ris
      - endnote
    sync_citations_from_academic_data: true

  search:
    include_code_blocks: true
    include_math: true
    enable_keyboard_shortcuts: true

  accessibility:
    math_alt_text: true
    code_contrast: AAA

  typography:
    scale: modular
    base_font_size: 18px

  images:
    sizes:
      - 320
      - 640
      - 960
      - 1280
      - 1920
    quality:
      avif: 50
      webp: 75
      jpeg: 85
      png: 90
    lazy_loading: lazy

  academic_integrations:
    google_scholar:
      profile_url: "" # Optional: Add profile URL (see docs/google-scholar-setup.md for instructions)
      user_id: "" # Optional: Add user ID for auto-refresh features
      auto_refresh: true
    orcid:
      profile_url: https://orcid.org/0009-0001-2022-7072
      auto_sync: true
      sync_scope:
        - works
        - funding
        - peer-review
    researchgate:
      profile_url: https://www.researchgate.net/profile/Diogo-Ribeiro
    academia:
      profile_url: https://www.academia.edu
    submissions:
      show_collaborators: true
      status_badges: true
    calendar:
      timezone: Europe/Lisbon
      show_submission_deadlines: true
    badges:
      emphasize_open_science: true
    collaboration:
      enable_opportunity_board: true
      enable_mentorship_listings: true

# Content organization (YAML anchors)
content:
  research_areas: *research_areas
  methodologies: *methodologies

# ==============================================================================
# SECTION 6: INTEGRATIONS (THIRD-PARTY SERVICES)
# ==============================================================================
# Configure external services and platforms.
# Most integrations are optional - enable only what you need.
# See docs/integrations/ for service-specific setup guides.
# ------------------------------------------------------------------------------

# Analytics (optional - leave empty to disable)
google_analytics: ""
analytics:
  ga4_property_id: ""
  ga4_credentials_path: ""

# Repository hosting
repository_url: https://github.com/DiogoRibeiro7/analytics-blog-jekyll
integrations:
  github:
    owner: DiogoRibeiro7
    api_base: https://api.github.com/repos
    cache_ttl: 43200
    enabled: true

  # Interactive notebooks
  binder:
    enabled: true
    url_template: https://mybinder.org/v2/gh/%{slug}/%{branch}?labpath=%{path}
  colab:
    enabled: true
    url_template: https://colab.research.google.com/github/%{slug}/blob/%{branch}/%{path}

  # Data platforms
  kaggle:
    enabled: true
    profile: diogoribeiro
  observable:
    enabled: true
  zenodo:
    enabled: true
    community: datalog
  dataverse:
    enabled: false

  # Academic profiles
  scholar:
    enabled: false # Set to true when Google Scholar is configured (see docs/google-scholar-setup.md)
    profile_id: "" # Add your Google Scholar user ID when enabling
    metrics_source: data/academic.yml
  orcid:
    enabled: true
    profile: https://orcid.org/0009-0001-2022-7072
    auto_sync: true
  researchgate:
    enabled: true
    profile: https://www.researchgate.net/profile/Diogo-Ribeiro
  academia:
    enabled: true
    profile: https://www.academia.edu

# ==============================================================================
# SECTION 7: NOTEBOOK INTEGRATION
# ==============================================================================
# Jupyter notebook rendering and interactive features.
# ------------------------------------------------------------------------------

notebooks:
  enabled: true
  source: _notebooks
  output: notebooks
  download_dir: notebooks
  default_layout: notebook
  collection: notebooks
  permalink_base: /notebooks
  repository: https://github.com/DiogoRibeiro7/analytics-blog-jekyll
  branch: main
  binder:
    base_url: https://mybinder.org/v2/gh/%{slug}/%{branch}?labpath=%{path}
  colab:
    base_url: https://colab.research.google.com/github/%{slug}/blob/%{branch}/%{path}

# ==============================================================================
# SECTION 8: DATALOG CUSTOM PLUGINS
# ==============================================================================
# Theme-specific plugin configurations.
# ------------------------------------------------------------------------------

datalog_plugins:
  enabled:
    - datalog-search
    - datalog-citations
    - datalog-slides
    - datalog-comments
  options:
    datalog-citations:
      bibliography_title: References
    datalog-slides:
      cdn: https://unpkg.com/reveal.js@5
      width: 100%
      height: 620px
    datalog-comments:
      provider: giscus
      repo: DiogoRibeiro7/analytics-blog-jekyll
      repo_id: GISCUS_REPO_ID
      category: General
      category_id: GISCUS_CATEGORY_ID
      mapping: pathname
      theme: light

# ==============================================================================
# SECTION 9: PHASE-SPECIFIC FEATURES
# ==============================================================================
# Progressive enhancement features organized by development phase.
# These can be enabled/disabled independently.
# ------------------------------------------------------------------------------

# Phase 1: Core enhancements
phase1_features:
  social_sharing:
    enabled: true
    platforms:
      - twitter
      - linkedin
      - facebook
      - reddit
      - email
      - copy
    show_count: false
  breadcrumbs:
    enabled: true
    separator: " / "
    show_home: true
    show_current: true
  author_bio:
    enabled: true
    position: after_content
    show_avatar: true
    show_social: true
    show_research_areas: true
    compact: false
  enhanced_toc:
    enabled: true
    sticky: true
    show_progress: true
    collapsible: true
    h_min: 2
    h_max: 4
    default_heading: "Table of Contents"
  difficulty_badges:
    enabled: true
    default_level: beginner
    show_icon: true
    show_description: false

# Phase 2: Advanced features
phase2_features:
  sidebar_layout:
    enabled: true
    show_toc: true
    show_info_card: true
    show_newsletter: true
    show_related: true
  series:
    enabled: true
    show_progress: true
    show_list: true
  search_facets:
    enabled: true
    show_tags: true
    show_categories: true
    show_difficulty: true
    show_dates: true
    show_authors: true
  code_sharing:
    enabled: true
    show_copy: true
    show_download: true
    show_playground: true
    show_share: true
  newsletter:
    enabled: false  # Enable when configured
    provider: "custom"
    action_url: ""
    success_message: "Thanks for subscribing!"
    privacy_url: "/privacy"

# Phase 3: Content engagement
phase3_features:
  archive:
    enabled: true
    group_by: year
    show_statistics: true
    show_filters: true
    show_excerpts: true
    posts_per_month: true
  reading_progress:
    enabled: true
    position: top
    show_time: true
    show_percentage: true
    words_per_minute: 200
  reading_time:
    enabled: true
    words_per_minute: 200
    show_word_count: false
    default_variant: inline
  recommendations:
    enabled: true
    max_recommendations: 3
    algorithm: hybrid
    layout: grid
    show_view_all: true
    show_score: false
  comments:
    enabled: true
    provider: giscus
    lazy_load: true
    show_count: true
    show_privacy_notice: true
    privacy_url: "/privacy"
    giscus:
      repo: "DiogoRibeiro7/analytics-blog-jekyll"
      repo_id: ""
      category: "General"
      category_id: ""
      mapping: pathname
      strict: 0
      reactions_enabled: 1
      emit_metadata: 0
      input_position: bottom
      theme: preferred_color_scheme
      lang: en
      loading: lazy
    utterances:
      repo: "DiogoRibeiro7/analytics-blog-jekyll"
      issue_term: pathname
      label: comment
      theme: github-light
    disqus:
      shortname: ""
    commento:
      url: "https://cdn.commento.io"
      no_fonts: false
      hide_deleted: false
      auto_init: true
    custom_html: ""

# Phase 4: User experience
phase4_features:
  user_preferences:
    enabled: true
    show_theme_toggle: true
    show_font_size: true
    show_reading_mode: true
    show_layout: true
    position: floating
  popular_posts:
    enabled: true
    max_posts: 5
    sort_by: recent
    show_stats: true
    show_thumbnail: true
    layout: list
    show_view_all: true
  navigation:
    back_to_top:
      enabled: true
      threshold: 300
    keyboard_shortcuts:
      enabled: true
  social_proof:
    enabled: true
    show_views: true
    show_trending: true
    show_readers: true
    show_completion: true
    compact: false
  enhanced_metadata:
    enabled: true
    show_updated_date: true
    show_tags_cloud: true
    show_category_path: true
    show_reading_level: true
    show_word_count: true
    layout: inline

# Phase 5: Advanced capabilities
phase5_features:
  i18n:
    enabled: true
    default_language: en
    languages: [en, es, fr, de, pt]
    show_flags: true
    position: header
  advanced_search:
    enabled: true
    show_filters: true
    show_sort: true
    highlight_matches: true
    results_per_page: 10
  bookmarks:
    enabled: true
    storage: localStorage
    max_bookmarks: 100
  performance:
    enabled: true
    track_core_web_vitals: true
    track_resource_timing: true
    report_to_analytics: false
  email_preferences:
    enabled: true
    topics: [ml, statistics, visualization, python]
    subscription_types: [weekly_digest, new_posts, comments, newsletter]

# ==============================================================================
# SECTION 10: PERFORMANCE & OPTIMIZATION
# ==============================================================================
# Build optimization and performance settings.
# ------------------------------------------------------------------------------

critical_css:
  enabled: true
  dimensions:
    - width: 1920
      height: 1080
    - width: 375
      height: 667
  penthouse_options:
    timeout: 30000

# ==============================================================================
# SECTION 11: DEVELOPMENT SETTINGS
# ==============================================================================
# Settings for local development (not used in production builds).
# ------------------------------------------------------------------------------

development:
  livereload: true

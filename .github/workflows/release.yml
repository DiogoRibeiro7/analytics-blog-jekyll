name: Release — Promote develop to main

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.3.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (validate only, do not merge)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: develop
          fetch-depth: 0

      - name: Verify version in changelog
        run: |
          VERSION="${{ inputs.version }}"
          if ! grep -q "\[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md does not contain an entry for version $VERSION"
            echo "Add a ## [$VERSION] section to CHANGELOG.md before releasing."
            exit 1
          fi
          echo "Changelog entry found for $VERSION"

      - name: Verify version in gemspec
        run: |
          VERSION="${{ inputs.version }}"
          GEMSPEC_VERSION=$(grep -oP 'VERSION = "\K[^"]+' lib/datalog/theme/version.rb || echo "")
          if [ "$GEMSPEC_VERSION" != "$VERSION" ]; then
            echo "::error::lib/datalog/theme/version.rb has VERSION=$GEMSPEC_VERSION, expected $VERSION"
            exit 1
          fi
          echo "Version matches: $VERSION"

      - name: Set up Ruby
        uses: ruby/setup-ruby@3ff19f5e2baf30647122352b96108b1fbe250c64 # v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:coverage

      - name: Build site
        run: |
          npm run build:js
          bundle exec jekyll build --trace

      - name: Run bundler-audit
        run: |
          gem install bundler-audit
          bundler-audit update
          bundler-audit check

  promote:
    name: Promote to main
    needs: validate
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge develop into main
        run: |
          git fetch origin main
          git checkout main
          git merge --no-ff develop -m "release: v${{ inputs.version }}

          Promote develop to main for release v${{ inputs.version }}.
          See CHANGELOG.md for details."
          git push origin main

      - name: Create release tag
        run: |
          git tag -a "v${{ inputs.version }}" -m "Release v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          # Extract changelog section for this version
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          gh release create "v$VERSION" --title "v$VERSION" --notes "$NOTES"

      - name: Summary
        run: |
          echo "## Release v${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Merged develop into main" >> $GITHUB_STEP_SUMMARY
          echo "- Created tag v${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub release published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The gem-release workflow will automatically publish to RubyGems." >> $GITHUB_STEP_SUMMARY

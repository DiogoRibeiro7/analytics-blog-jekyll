name: Update Citations

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

jobs:
  sync:
    name: Refresh Google Scholar metrics
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install scholarly pyyaml

      - name: Update citation metrics
        run: python scripts/update_google_scholar.py

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7
        with:
          commit_message: "chore: refresh Google Scholar metrics"
          file_pattern: _data/academic.yml

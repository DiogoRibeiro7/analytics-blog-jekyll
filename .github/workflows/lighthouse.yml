name: Lighthouse CI

on:
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  lighthouse:
    name: Performance audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build JS bundles
        run: npm run build:js

      # The deploy inlines critical CSS and loads the stylesheet asynchronously;
      # measure that configuration rather than the plain build.
      - name: Generate critical CSS
        env:
          JEKYLL_ENV: production
          NODE_ENV: production
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 1
        run: npm run build:critical

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false

name: Tests

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build JS bundles
        run: npm run build:js

      - name: Run unit tests
        if: matrix.node != '22'
        run: npm run test

      # The Node 22 leg runs the suite once with coverage, which enforces the
      # thresholds in vitest.config.js and scripts/check_coverage.js. These
      # steps used to wait for a Node 20 leg the matrix no longer has, so the
      # thresholds only ran in the deploy after a merge.
      - name: Run unit tests with coverage
        if: matrix.node == '22'
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        if: matrix.node == '22' && github.event_name == 'push' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/lcov.info
          flags: unit
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  jekyll-build:
    name: Jekyll Build & Ruby Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Run bundler-audit
        run: |
          gem install bundler-audit
          bundler-audit update
          bundler-audit check

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build JS bundles
        run: npm run build:js

      # The layouts read _data/js_manifest.json, so it is committed; a copy
      # that no longer matches the sources points pages at the wrong bundles.
      - name: Check the committed script manifest matches the build
        run: git diff --exit-code -- _data/js_manifest.json

      # The image optimizer creates resized, AVIF and WebP copies only where
      # ImageMagick and avifenc are installed. tests/test_image_variants.rb
      # encodes with them, and DATALOG_IMAGE_TOOLS=required makes the tests
      # that need them fail instead of skipping.
      - name: Install image encoders
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick libavif-bin

      - name: Build site
        env:
          JEKYLL_ENV: test
        run: bundle exec jekyll build --trace

      # Also `bundle exec rake test`. The suite replaced `rake ci:verify`, whose
      # scripts checked source files for strings; Python was only set up here
      # for one of them.
      # DATALOG_CRITICAL_CSS=required: `npm ci` above installs critical and the
      # Chrome it runs, so its consumer test must not skip here.
      - name: Run Minitest suite
        env:
          DATALOG_IMAGE_TOOLS: required
          DATALOG_CRITICAL_CSS: required
        run: bundle exec ruby -Itests -e "Dir['tests/test_*.rb'].sort.each { |file| require_relative file }"

      - name: Upload build artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jekyll-build-artifacts
          path: _site
          retention-days: 7

  # The gemspec supports Ruby 3.2 and later. The job above runs the oldest; this
  # one runs the Ruby suite on the newer releases. It is a separate job because
  # a matrix on the job above would rename "Jekyll Build & Ruby Tests", which
  # branch protection requires by name.
  ruby-versions:
    name: Ruby Tests (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    # The 3.4 leg runs the suite under SimpleCov, which costs about three
    # times the runtime of a plain run.
    timeout-minutes: 25
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4']

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build JS bundles
        run: npm run build:js

      - name: Run Minitest suite
        if: matrix.ruby != '3.4'
        run: bundle exec rake test

      # One leg runs it under SimpleCov, which enforces the thresholds in
      # .simplecov. It costs about three times the runtime, so only one leg
      # pays it — the same shape as the Node 22 leg above.
      - name: Run Minitest suite with coverage
        if: matrix.ruby == '3.4'
        run: bundle exec rake coverage

      - name: Upload coverage to Codecov
        if: matrix.ruby == '3.4' && github.event_name == 'push' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/coverage.json
          flags: ruby
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # The Playwright specs in tests/integration/ used to run only in the deploy
  # after a merge, so a browser regression reached develop with every pull
  # request check green.
  browser-tests:
    name: Browser Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build JS bundles
        run: npm run build:js

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Builds the site, serves it and runs the specs.
      - name: Run Playwright suite
        env:
          CI: 'true'
        run: npm run test:integration

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # ESLint and RuboCop were configured in the repository but ran in no workflow.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: '3.2'
          bundler-cache: true

      # Offenses that predate this job are listed in .rubocop_todo.yml; new code has none.
      - name: Run RuboCop
        run: bundle exec rubocop

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, jekyll-build, ruby-versions, browser-tests, lint]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Unit Tests:** ${{ needs.unit-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Jekyll Build:** ${{ needs.jekyll-build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Ruby 3.3 and 3.4:** ${{ needs.ruby-versions.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Browser Tests:** ${{ needs.browser-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Lint:** ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.unit-tests.result }}" != "success" ] || [ "${{ needs.jekyll-build.result }}" != "success" ] || [ "${{ needs.ruby-versions.result }}" != "success" ] || [ "${{ needs.browser-tests.result }}" != "success" ] || [ "${{ needs.lint.result }}" != "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ Some tests failed. Please review the logs." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ All tests passed successfully!" >> $GITHUB_STEP_SUMMARY
          fi

name: Visual regression (Percy)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: percy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-diff:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: '1'
      PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
      PERCY_ENABLED: ${{ secrets.PERCY_TOKEN != '' }}
    steps:
      - name: Percy configuration check
        if: env.PERCY_ENABLED != 'true'
        run: |
          echo "::notice::Percy visual regression skipped — no PERCY_TOKEN configured."
          echo "::notice::Add the PERCY_TOKEN secret to enable automated visual uploads."

      - name: Check out repository
        if: env.PERCY_ENABLED == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Ruby
        if: env.PERCY_ENABLED == 'true'
        uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Set up Node.js
        if: env.PERCY_ENABLED == 'true'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '20'

      - name: Install Node.js dependencies
        if: env.PERCY_ENABLED == 'true'
        run: npm ci

      - name: Install Python tooling
        if: env.PERCY_ENABLED == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Prepare notebook dependencies
        if: env.PERCY_ENABLED == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build static site
        if: env.PERCY_ENABLED == 'true'
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace

      - name: Run Percy visual tests
        if: env.PERCY_ENABLED == 'true'
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: |
          npx http-server _site -p 4173 --silent &
          SERVER_PID=$!
          npx wait-on http://127.0.0.1:4173
          npm run test:visual:percy
          kill $SERVER_PID

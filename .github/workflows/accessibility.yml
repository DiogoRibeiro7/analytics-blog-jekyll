name: Accessibility Audit

on:
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

# A newer push to the same pull request cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pa11y:
    name: Pa11y checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build JS bundles
        run: npm run build:js

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace

      # http-server and wait-on are devDependencies. pa11y-ci is installed here,
      # pinned, and without Puppeteer's own browser. That download failed this
      # job more than once with "All providers failed for chrome-headless-shell"
      # while nothing was wrong with the pages, and a rerun passed. The runner
      # image ships Google Chrome, so Puppeteer is pointed at it instead.
      - name: Install Pa11y CI
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm install --no-save pa11y-ci@4.1.1

      - name: Find the runner's Chrome
        id: chrome
        run: |
          for candidate in google-chrome google-chrome-stable chromium-browser chromium; do
            if path="$(command -v "$candidate")"; then
              echo "path=$path" >> "$GITHUB_OUTPUT"
              "$path" --version
              exit 0
            fi
          done
          echo "::error::No Chrome on the runner. Remove PUPPETEER_SKIP_DOWNLOAD from the install step to let Puppeteer fetch its own."
          exit 1

      - name: Run Pa11y CI
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.path }}
        run: |
          npx http-server _site -p 4000 --silent &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          npx wait-on http://localhost:4000 --timeout 60000
          npx pa11y-ci --config pa11yci.json

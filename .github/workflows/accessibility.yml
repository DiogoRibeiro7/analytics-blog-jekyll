name: Accessibility Audit

on:
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  pa11y:
    name: Pa11y checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@c984c1a20bb35a1cbda04477c816cea024418be9 # v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '20'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install nbformat jupyter

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace

      - name: Install accessibility tooling
        run: npm install --no-save pa11y-ci http-server

      - name: Run Pa11y CI
        run: |
          npx http-server _site -p 4000 --silent &
          SERVER_PID=$!
          npx pa11y-ci --config pa11yci.json
          kill $SERVER_PID

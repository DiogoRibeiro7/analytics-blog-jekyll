name: Stale Issues & PRs

on:
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 9 AM UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@b5d41d4e1d5dceea10e7104786b73624c18a190f # v10.2.0
        with:
          days-before-stale: 60
          days-before-close: 30
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >
            This issue has been inactive for 60 days and has been marked as stale.
            It will be closed in 30 days unless there is new activity.
            If this is still relevant, please comment or update the issue.
          stale-pr-message: >
            This pull request has been inactive for 60 days and has been marked as stale.
            It will be closed in 30 days unless there is new activity.
          close-issue-message: >
            This issue has been closed due to inactivity. Feel free to reopen
            if it is still relevant.
          exempt-issue-labels: 'priority:P0,priority:P1,security,in-progress'
          exempt-pr-labels: 'priority:P0,priority:P1,security,in-progress'
          exempt-all-milestones: true

name: Dependency Review & Security Audit

on:
  pull_request:
    branches: [ develop ]
  push:
    branches: [ develop ]
  schedule:
    # Run daily at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0, GPL-3.0
          comment-summary-in-pr: always

  npm-audit:
    name: npm Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          npm audit --audit-level=moderate --json > npm-audit.json || true
          npm audit --audit-level=moderate

      - name: Upload npm audit results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: npm-audit-results
          path: npm-audit.json
          retention-days: 30

  bundler-audit:
    name: Bundler Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@c984c1a20bb35a1cbda04477c816cea024418be9 # v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install bundler-audit
        run: gem install bundler-audit

      - name: Update bundler-audit database
        run: bundler-audit update

      - name: Run bundler-audit
        run: bundler-audit check

  python-audit:
    name: Python Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install safety
        run: pip install safety

      - name: Check for Python vulnerabilities
        continue-on-error: true
        run: |
          # Create requirements file from scripts
          find scripts -name "*.py" -exec grep -h "^import\|^from" {} \; | \
            grep -v "^from \." | \
            sort -u > requirements-check.txt || true

          # Run safety check if pip packages are used
          if [ -s requirements-check.txt ]; then
            safety check --json || true
          else
            echo "No Python dependencies to check"
          fi

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [npm-audit, bundler-audit, python-audit]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Generate Security Summary
        run: |
          echo "# Security Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Audit Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **npm audit:** ${{ needs.npm-audit.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Bundler audit:** ${{ needs.bundler-audit.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Python audit:** ${{ needs.python-audit.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See individual job logs for details." >> $GITHUB_STEP_SUMMARY

      - name: Check if any audit failed
        if: needs.npm-audit.result == 'failure' || needs.bundler-audit.result == 'failure'
        run: |
          echo "::error::Security vulnerabilities detected. Please review the audit results."
          exit 1

name: Sync Priority Labels to Project

on:
  issues:
    types: [labeled, unlabeled, opened]

permissions:
  issues: read
  repository-projects: write

jobs:
  sync-priority:
    runs-on: ubuntu-latest
    if: github.event.issue
    steps:
      - name: Determine priority from labels
        id: priority
        run: |
          LABELS='${{ toJson(github.event.issue.labels.*.name) }}'
          PRIORITY=""
          if echo "$LABELS" | grep -q '"priority:P0"'; then
            PRIORITY="P0"
          elif echo "$LABELS" | grep -q '"priority:P1"'; then
            PRIORITY="P1"
          elif echo "$LABELS" | grep -q '"priority:P2"'; then
            PRIORITY="P2"
          elif echo "$LABELS" | grep -q '"priority:P3"'; then
            PRIORITY="P3"
          fi
          echo "priority=$PRIORITY" >> "$GITHUB_OUTPUT"
          echo "Detected priority: ${PRIORITY:-none}"

      - name: Update project priority field
        if: steps.priority.outputs.priority != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PRIORITY: ${{ steps.priority.outputs.priority }}

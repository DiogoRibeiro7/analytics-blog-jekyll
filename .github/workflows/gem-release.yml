name: Gem Release

# Publishes datalog-theme to RubyGems when a v* tag is pushed. Two credential
# modes, selected by the RUBYGEMS_TRUSTED_PUBLISHING repository variable:
#
#   "true"  -> trusted publishing: the job authenticates with an OpenID Connect
#              token, no long-lived secret. Requires a trusted publisher on
#              rubygems.org for this repository, this workflow file and the
#              rubygems environment.
#   unset   -> the RUBYGEMS_API_KEY secret of the rubygems environment.
#
# Either way the job waits for approval in the rubygems environment first.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build and publish gem
    runs-on: ubuntu-latest
    environment:
      name: rubygems
      url: https://rubygems.org/gems/datalog-theme
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build gem
        run: gem build datalog-theme.gemspec

      - name: Configure RubyGems credentials (trusted publishing)
        if: vars.RUBYGEMS_TRUSTED_PUBLISHING == 'true'
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Publish gem (trusted publishing)
        if: vars.RUBYGEMS_TRUSTED_PUBLISHING == 'true'
        run: gem push datalog-theme-*.gem

      - name: Publish gem (API key)
        if: vars.RUBYGEMS_TRUSTED_PUBLISHING != 'true'
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          if [ -z "$GEM_HOST_API_KEY" ]; then
            echo "::error::RUBYGEMS_API_KEY is not configured in the rubygems environment, and trusted publishing is not enabled (RUBYGEMS_TRUSTED_PUBLISHING variable)."
            exit 1
          fi
          gem push datalog-theme-*.gem

name: Gem Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build and publish gem
    runs-on: ubuntu-latest
    environment:
      name: rubygems
      url: https://rubygems.org/gems/datalog-theme
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@319994f95fa847cf3fb3cd3dbe89f6dcde9f178f # v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build gem
        run: gem build datalog-theme.gemspec

      - name: Publish gem
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          if [ -z "$GEM_HOST_API_KEY" ]; then
            echo "RUBYGEMS_API_KEY secret is not configured."
            exit 1
          fi
          mkdir -p ~/.gem
          cat <<CREDENTIALS > ~/.gem/credentials
---
:rubygems_api_key: $GEM_HOST_API_KEY
CREDENTIALS
          chmod 600 ~/.gem/credentials
          gem push datalog-theme-*.gem

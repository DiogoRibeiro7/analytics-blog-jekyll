name: Gem Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build and publish gem
    runs-on: ubuntu-latest
    environment:
      name: rubygems
      url: https://rubygems.org/gems/datalog-theme
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build gem
        run: gem build datalog-theme.gemspec

      - name: Publish gem
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          if [ -z "$GEM_HOST_API_KEY" ]; then
            echo "RUBYGEMS_API_KEY secret is not configured."
            exit 1
          fi
          # gem push reads GEM_HOST_API_KEY from the environment, so no credentials
          # file is needed. The previous heredoc had its body at column 0, which
          # ended the YAML block early: the step wrote an empty file and never pushed.
          gem push datalog-theme-*.gem

version: 2
# Dependabot appends the scope to each prefix ("deps", or "deps-dev" for
# development dependencies), so these titles read chore(deps), chore(deps-dev)
# and ci(deps). Prefixes that already carried a scope produced titles like
# chore(deps-dev)(deps-dev).
updates:
  # npm dependencies (Node.js packages)
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    reviewers:
      - "DiogoRibeiro7"
    labels:
      - "dependencies"
      - "npm"
      - "automated"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    groups:
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    versioning-strategy: increase

  # Bundler dependencies (Ruby gems)
  - package-ecosystem: "bundler"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    reviewers:
      - "DiogoRibeiro7"
    labels:
      - "dependencies"
      - "ruby"
      - "automated"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      jekyll-plugins:
        patterns:
          - "jekyll-*"
        update-types:
          - "minor"
          - "patch"
    versioning-strategy: increase

  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    reviewers:
      - "DiogoRibeiro7"
    labels:
      - "dependencies"
      - "python"
      - "automated"
    commit-message:
      prefix: "chore"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "DiogoRibeiro7"
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
    commit-message:
      prefix: "ci"
      include: "scope"

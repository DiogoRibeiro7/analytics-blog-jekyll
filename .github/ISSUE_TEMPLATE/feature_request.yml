name: Feature Request
description: Suggest a new feature or enhancement for DataLog theme
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please fill out the sections below to help us understand your request.

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      description: Please confirm the following before submitting
      options:
        - label: I have searched existing issues to ensure this isn't a duplicate
          required: true
        - label: I have read the [documentation](https://github.com/DiogoRibeiro7/analytics-blog-jekyll#readme) to confirm this feature doesn't already exist
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe what you're trying to accomplish.
      placeholder: I'm frustrated when... I want to be able to...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see
      placeholder: I would like DataLog to...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered
      placeholder: I also considered... Another approach could be...
    validations:
      required: false

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: Which area does this feature relate to?
      options:
        - Layout/Design
        - Notebook Integration
        - Analytics/Dashboard
        - Search Functionality
        - Visualization Tools
        - Math Rendering
        - Build Process
        - Plugin System
        - CLI Tool
        - Documentation
        - Accessibility
        - Performance
        - SEO
        - Other
    validations:
      required: true

  - type: dropdown
    id: audience
    attributes:
      label: Target Audience
      description: Who would benefit from this feature?
      options:
        - Data Scientists
        - Researchers
        - Technical Writers
        - Students
        - Educators
        - All Users
        - Theme Developers
    validations:
      required: false

  - type: textarea
    id: use-cases
    attributes:
      label: Use Cases
      description: Provide specific examples of how this feature would be used
      placeholder: |
        1. As a data scientist, I want to... so that...
        2. When publishing research, I need to...
    validations:
      required: false

  - type: textarea
    id: examples
    attributes:
      label: Examples / References
      description: Links to similar implementations in other themes or tools
      placeholder: |
        - Example 1: https://example.com
        - Example 2: https://another-example.com
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Critical (blocking my usage)
        - High (very important)
        - Medium (nice to have)
        - Low (minor enhancement)
    validations:
      required: false

  - type: textarea
    id: mockups
    attributes:
      label: Mockups / Wireframes
      description: If applicable, add mockups or wireframes to illustrate the feature
      placeholder: Drag and drop images here...
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Would you be interested in contributing to this feature?
      options:
        - label: I would be willing to submit a pull request for this feature
          required: false
        - label: I can help with testing this feature
          required: false
        - label: I can help with documentation for this feature
          required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, technical details, or considerations
      placeholder: Implementation notes... Edge cases to consider...
    validations:
      required: false

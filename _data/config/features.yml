# =============================================================================
# Feature Configuration
# =============================================================================
# Enable/disable features and customize their behavior.
# Features are organized by release phase for easy understanding.
#
# Documentation: https://github.com/DiogoRibeiro7/analytics-blog-jekyll/docs/configuration.md
# =============================================================================

# -----------------------------------------------------------------------------
# Core Feature Flags
# -----------------------------------------------------------------------------
core:
  mathjax: true
  math_toolkit: true
  math_search: true
  search: true
  accessibility_skip_link: true
  dark_mode_toggle: true
  notebook_support: true
  portfolio: true
  datasets: true
  visualizations: true
  academic_dashboard: true
  citation_tracking: true
  academic_calendar: true

# -----------------------------------------------------------------------------
# Critical CSS
# -----------------------------------------------------------------------------
critical_css:
  enabled: true
  dimensions:
    - width: 1920
      height: 1080
    - width: 375
      height: 667
  penthouse_options:
    timeout: 30000

# -----------------------------------------------------------------------------
# Phase 1: Social & Navigation
# -----------------------------------------------------------------------------
social_sharing:
  enabled: true
  platforms:
    - twitter
    - linkedin
    - facebook
    - reddit
    - email
    - copy
  show_count: false

breadcrumbs:
  enabled: true
  separator: " / "
  show_home: true
  show_current: true

author_bio:
  enabled: true
  position: after_content  # before_content, after_content
  show_avatar: true
  show_social: true
  show_research_areas: true
  compact: false

enhanced_toc:
  enabled: true
  sticky: true
  show_progress: true
  collapsible: true
  h_min: 2
  h_max: 4
  default_heading: "Table of Contents"

difficulty_badges:
  enabled: true
  default_level: beginner
  show_icon: true
  show_description: false

# -----------------------------------------------------------------------------
# Phase 2: Layout & Search
# -----------------------------------------------------------------------------
sidebar_layout:
  enabled: true
  show_toc: true
  show_info_card: true
  show_newsletter: true
  show_related: true

series:
  enabled: true
  show_progress: true
  show_list: true

search_facets:
  enabled: true
  show_tags: true
  show_categories: true
  show_difficulty: true
  show_dates: true
  show_authors: true

code_sharing:
  enabled: true
  show_copy: true
  show_download: true
  show_playground: true
  show_share: true

newsletter:
  enabled: false  # Enable when newsletter service is configured
  provider: "custom"  # mailchimp, convertkit, buttondown, custom
  action_url: ""
  success_message: "Thanks for subscribing!"
  privacy_url: "/privacy"

# -----------------------------------------------------------------------------
# Phase 3: Reading Experience
# -----------------------------------------------------------------------------
archive:
  enabled: true
  group_by: year  # year, month, category, tag
  show_statistics: true
  show_filters: true
  show_excerpts: true
  posts_per_month: true

reading_progress:
  enabled: true
  position: top  # top, bottom, sticky
  show_time: true
  show_percentage: true
  words_per_minute: 200

reading_time:
  enabled: true
  words_per_minute: 200
  show_word_count: false
  default_variant: inline  # inline, badge, detailed

recommendations:
  enabled: true
  max_recommendations: 3
  algorithm: hybrid  # tag-based, category-based, hybrid
  layout: grid  # grid, list, compact
  show_view_all: true
  show_score: false

comments:
  enabled: true
  provider: giscus  # giscus, utterances, disqus, commento, custom, none
  lazy_load: true
  show_count: true
  show_privacy_notice: true
  privacy_url: "/privacy"
  giscus:
    repo: "DiogoRibeiro7/analytics-blog-jekyll"
    repo_id: ""  # Get from https://giscus.app
    category: "General"
    category_id: ""  # Get from https://giscus.app
    mapping: pathname
    strict: 0
    reactions_enabled: 1
    emit_metadata: 0
    input_position: bottom
    theme: preferred_color_scheme
    lang: en
    loading: lazy
  utterances:
    repo: "DiogoRibeiro7/analytics-blog-jekyll"
    issue_term: pathname
    label: comment
    theme: github-light
  disqus:
    shortname: ""
  commento:
    url: "https://cdn.commento.io"
    no_fonts: false
    hide_deleted: false
    auto_init: true
  custom_html: ""

# -----------------------------------------------------------------------------
# Phase 4: User Experience
# -----------------------------------------------------------------------------
user_preferences:
  enabled: true
  show_theme_toggle: true
  show_font_size: true
  show_reading_mode: true
  show_layout: true
  position: floating  # floating, sidebar

popular_posts:
  enabled: true
  max_posts: 5
  sort_by: recent  # recent, comments, trending
  show_stats: true
  show_thumbnail: true
  layout: list  # list, grid, compact
  show_view_all: true

navigation:
  back_to_top:
    enabled: true
    threshold: 300  # pixels scrolled before showing
  keyboard_shortcuts:
    enabled: true

social_proof:
  enabled: true
  show_views: true
  show_trending: true
  show_readers: true
  show_completion: true
  compact: false

enhanced_metadata:
  enabled: true
  show_updated_date: true
  show_tags_cloud: true
  show_category_path: true
  show_reading_level: true
  show_word_count: true
  layout: inline  # inline, stacked, card

# -----------------------------------------------------------------------------
# Phase 5: Advanced Features
# -----------------------------------------------------------------------------
i18n:
  enabled: true
  default_language: en
  languages: [en, es, fr, de, pt]
  show_flags: true
  position: header

advanced_search:
  enabled: true
  show_filters: true
  show_sort: true
  highlight_matches: true
  results_per_page: 10

bookmarks:
  enabled: true
  storage: localStorage
  max_bookmarks: 100

performance:
  enabled: true
  track_core_web_vitals: true
  track_resource_timing: true
  report_to_analytics: false

email_preferences:
  enabled: true
  topics: [ml, statistics, visualization, python]
  subscription_types: [weekly_digest, new_posts, comments, newsletter]

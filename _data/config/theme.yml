# =============================================================================
# Theme Configuration
# =============================================================================
# Visual and behavioral settings for the DataLog theme.
# Customize colors, typography, math rendering, and syntax highlighting.
#
# Documentation: https://github.com/DiogoRibeiro7/analytics-blog-jekyll/docs/configuration.md
# =============================================================================

# -----------------------------------------------------------------------------
# Academic styling
# -----------------------------------------------------------------------------
academic:
  color_schemes:
    light: "#0b1d3d"
    dark: "#f5f7ff"
    accent: "#3277f6"
  typography:
    body: "Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    headings: "Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    code: "'Fira Code', 'Source Code Pro', monospace"
  layout:
    max_width: 80rem
    column_gap: 2.5rem

# -----------------------------------------------------------------------------
# Math rendering (MathJax/KaTeX)
# -----------------------------------------------------------------------------
math:
  engine: mathjax  # Options: mathjax, katex
  output: chtml
  equation_numbering: true
  accessibility: true
  render_on_load: true
  katex_cdn: https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/
  mathjax_cdn: https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js

# -----------------------------------------------------------------------------
# Syntax highlighting (Prism)
# -----------------------------------------------------------------------------
syntax_highlighting:
  engine: prism
  cdn: https://cdn.jsdelivr.net/npm/prismjs@1.29.0
  themes:
    light: prism-coy
    dark: prism-tomorrow
  components:
    - core
    - python
    - r
    - sql
    - julia
    - javascript
  # Per-language theme overrides (optional)
  language_overrides:
    python: prism-coy
    r: prism-okaidia
    sql: prism-twilight
    julia: prism-atom-dark
    javascript: prism-material-oceanic

# -----------------------------------------------------------------------------
# Data visualizations
# -----------------------------------------------------------------------------
visualizations:
  responsive: true
  lazy_load: true
  plotly:
    version: 2.27.0
    mode_bar: true
  d3:
    version: 7
    csp_compliant: true
  observable:
    trusted_domains:
      - https://observablehq.com
  bokeh:
    resources: cdn
  shiny:
    iframe_title: "Embedded R Shiny application"

# -----------------------------------------------------------------------------
# Typography settings
# -----------------------------------------------------------------------------
typography:
  scale: modular
  base_font_size: 18px

# -----------------------------------------------------------------------------
# Image optimization
# -----------------------------------------------------------------------------
images:
  sizes:
    - 320
    - 640
    - 960
    - 1280
    - 1920
  quality:
    avif: 50
    webp: 75
    jpeg: 85
    png: 90
  lazy_loading: lazy

# -----------------------------------------------------------------------------
# Localization
# -----------------------------------------------------------------------------
localization:
  default_locale: en
  locales:
    - code: en
      label: English
      url: /
  rtl_locales:
    - ar
    - he

# -----------------------------------------------------------------------------
# Programming language filters (for content filtering)
# -----------------------------------------------------------------------------
filters:
  languages:
    - label: Python
      url: /tags/python/
    - label: R
      url: /tags/r/
    - label: SQL
      url: /tags/sql/
    - label: Julia
      url: /tags/julia/
    - label: JavaScript
      url: /tags/javascript/
    - label: Scala
      url: /tags/scala/

# -----------------------------------------------------------------------------
# Dataset defaults
# -----------------------------------------------------------------------------
datasets:
  default_license: CC-BY-4.0
  availability_statement: "Datasets include licensing, provenance, and methodological notes."

# -----------------------------------------------------------------------------
# Project showcase settings
# -----------------------------------------------------------------------------
projects:
  default_repository: DiogoRibeiro7/analytics-blog-jekyll
  showcase_tags:
    - predictive-modeling
    - experimental-design
    - visualization

# -----------------------------------------------------------------------------
# Publications/Bibliography
# -----------------------------------------------------------------------------
publications:
  bibtex_source: assets/publications/publications.bib
  sort_order: descending
  group_by: year
  include_bibliography: true
  export_formats:
    - bibtex
    - ris
    - endnote
  sync_citations_from_academic_data: true

# -----------------------------------------------------------------------------
# Search behavior
# -----------------------------------------------------------------------------
search:
  include_code_blocks: true
  include_math: true
  enable_keyboard_shortcuts: true

# -----------------------------------------------------------------------------
# Accessibility
# -----------------------------------------------------------------------------
accessibility:
  math_alt_text: true
  code_contrast: AAA

- id: datalog-citations
  name: DataLog Citations
  summary: Cite works from a BibTeX or CSL-JSON file, numbered or author-year, with a list of the cited works linked both ways, build errors for unknown keys, and citation metadata for Google Scholar.
  hooks:
    - before_render
    - custom_liquid_tags
    - search_indexing
  includes:
    - '{% cite rubin1987 %} — a citation, linked to its entry; {% cite a b p="12" %} for several, with a locator.'
    - '{% datalog_bibliography %} — the list of the cited works, which the post and research layouts place themselves.'
  configuration:
    bibliography_title: The heading of the list.
  status: bundled

- id: datalog-slides
  name: DataLog Slides
  summary: Embed Reveal.js or hosted slide decks with automatic metadata and search signals.
  hooks:
    - before_render
    - custom_liquid_tags
    - search_indexing
  includes:
    - '{% datalog_slides %} — display the configured deck inside any post or page.'
  configuration:
    cdn: Override the Reveal.js CDN root.
    theme: Apply a default slide theme.
  status: bundled

- id: datalog-comments
  name: DataLog Comments
  summary: Wire up community discussion using Giscus, Utterances, or Disqus from front matter.
  hooks:
    - before_render
    - custom_liquid_tags
    - search_indexing
  includes:
    - '{% datalog_comments %} — render the provider embed.'
  configuration:
    provider: Select `giscus`, `utterances`, or `disqus`.
    mapping: Control how threads are matched to posts.
    theme: Choose the embed palette.
  status: bundled

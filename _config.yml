# =============================================================================
# DataLog Jekyll Theme Configuration
# =============================================================================
# This is the core Jekyll configuration file. Everything the theme reads lives
# here, except the author profile used by the about and research pages, which
# is in _data/config/author.yml (exposed to templates as site.data.config.author).
# Integration settings (GitHub, Binder, Colab, Giscus) live in this file under
# `integrations:` and `datalog_plugins:` and are exposed as `site.integrations`.
# =============================================================================

# -----------------------------------------------------------------------------
# Core Site Settings
# -----------------------------------------------------------------------------
name: DataLog
locale: en_US
title: DataLog | Data Science & Research Theme
email: diogo.debastos.ribeiro@gmail.com
description: >-
  DataLog is a clean and academic-inspired Jekyll theme crafted for
  data scientists, researchers, and technical writers who want to share
  reproducible analyses, research papers, tutorials, datasets, and project portfolios.
url: "https://diogoribeiro7.github.io"
baseurl: ""
theme_version: 0.9.2

# The licence of the articles' text and figures (the repository's LICENSE covers
# the theme's software). A page sets its own with `license:`, or none with `license: false`.
content_license: CC-BY-4.0

# Scholarly discovery metadata (the meta tags Google Scholar and reference managers
# read) on every post and research article. Without it, a page gets them only
# with `scholarly: true` in its front matter.
scholarly: true

# Author (basic info for Jekyll - full profile in _data/config/author.yml)
author:
  name: Diogo Ribeiro
  affiliation: ESMAD - Instituto Politécnico do Porto
  email: dfr@esmad.ipp.pt
  orcid: https://orcid.org/0009-0001-2022-7072
  github: DiogoRibeiro7
  twitter: DiogoRibeiro7
  linkedin: diogoribeiro

# Who publishes the site in structured data and citations. Left out, the author
# publishes it as a Person; the affiliation above stays on the author.
# publisher:
#   type: Organization
#   name: Example Lab
#   url: https://example.org/lab
#   logo: /assets/img/lab-logo.png

contact_email: diogo.debastos.ribeiro@gmail.com
repository_url: https://github.com/DiogoRibeiro7/analytics-blog-jekyll

# -----------------------------------------------------------------------------
# Build Settings
# -----------------------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  math_engine: mathjax
  smart_quotes: ["apos", "apos", "quot", "quot"]
  syntax_highlighter_opts:
    block:
      line_numbers: true
highlighter: rouge

permalink: pretty
paginate: 10
paginate_path: "/blog/page:num/"
timezone: Europe/Lisbon

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------
collections:
  portfolio:
    output: true
    permalink: /portfolio/:name/
  datasets:
    output: true
    permalink: /datasets/:name/
  notebooks:
    output: false
    permalink: /notebooks/:name/
  packages:
    output: true
    permalink: /packages/:name/

# -----------------------------------------------------------------------------
# Directories
# -----------------------------------------------------------------------------
includes_dir: _includes
layouts_dir: _layouts
include:
  - _pages
  - .well-known
sass:
  sass_dir: _sass
  style: compressed

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-include-cache
  - jekyll-redirect-from

# jekyll-feed: the footer (_data/social.yml) links to these feeds in addition
# to the default /feed.xml.
feed:
  categories:
    - research
    - tutorials
  collections:
    datasets:
      path: "/datasets/feed.xml"

# -----------------------------------------------------------------------------
# Notebook Integration
# -----------------------------------------------------------------------------
notebooks:
  enabled: true
  source: _notebooks
  output: notebooks
  download_dir: notebooks
  default_layout: notebook
  collection: notebooks
  permalink_base: /notebooks
  repository: https://github.com/DiogoRibeiro7/analytics-blog-jekyll
  branch: main
  binder:
    base_url: https://mybinder.org/v2/gh/%{slug}/%{branch}?labpath=%{path}
  colab:
    base_url: https://colab.research.google.com/github/%{slug}/blob/%{branch}/%{path}

# -----------------------------------------------------------------------------
# Theme Defaults
# -----------------------------------------------------------------------------
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      toc: true
      author: Diogo Ribeiro
  - scope:
      path: ""
      type: "portfolio"
    values:
      layout: portfolio
      hero_image: /assets/img/portfolio-placeholder.svg
  - scope:
      path: ""
      type: "datasets"
    values:
      layout: dataset
      download_button: true
  - scope:
      path: "_pages"
    values:
      layout: page

# -----------------------------------------------------------------------------
# SEO & Social
# -----------------------------------------------------------------------------
seo:
  type: "ResearchProject"
  name: "DataLog"
  description: "Jekyll theme for data science and research communication"

social:
  twitter: datalog_theme
  github: DiogoRibeiro7
  linkedin: diogoribeiro
  default_image: /assets/img/social-card.png

google_analytics: "" # Set to your GA4 measurement ID (e.g. "G-XXXXXXXXXX") to enable tracking

# Content Security Policy: hosts this site embeds iframes from, besides
# Observable. The demo's R Shiny example is served from shiny.posit.co.
csp:
  frame_src:
    - https://shiny.posit.co
    - https://*.shinyapps.io
    - https://revealjs.com

# -----------------------------------------------------------------------------
# Feature Flags
# -----------------------------------------------------------------------------
features:
  mathjax: true
  search: true
  dark_mode_toggle: true
  portfolio: true
  datasets: true
  visualizations: true
  academic_dashboard: true
  citation_tracking: true

critical_css:
  enabled: true
  dimensions:
    - width: 1920
      height: 1080
    - width: 375
      height: 667
  penthouse_options:
    timeout: 30000

# -----------------------------------------------------------------------------
# Theme Options
# -----------------------------------------------------------------------------
theme_options:
  # The "Reading mode" control on posts: the article without the site around it.
  reading_mode:
    enabled: true
    remember: false   # true keeps a reader's choice from one post to the next
  # Bookmarks, reading progress and private highlights, kept in the reader's browser.
  reading_state:
    enabled: true
    bookmarks: true
    progress: true
    highlights: true
    list_url: /saved/  # the page that lists the saved articles (components/reading-list.html)
  math:
    engine: mathjax
    output: chtml
    accessibility: true
    render_on_load: auto
    katex_cdn: https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/
    mathjax_cdn: https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js
  localization:
    default_locale: en
    locales:
      - code: en
        label: English
        url: /

# -----------------------------------------------------------------------------
# Integrations
# -----------------------------------------------------------------------------
integrations:
  github:
    owner: DiogoRibeiro7
    api_base: https://api.github.com/repos
    cache_ttl: 43200
    enabled: true
# The Binder and Colab buttons on notebook pages are set under `notebooks:`
# above (repository, branch, binder.base_url, colab.base_url).

# -----------------------------------------------------------------------------
# Dynamic Services (docs/dynamic-services.md)
# -----------------------------------------------------------------------------
# The optional backend the browser calls for correction reports, contact,
# comments and the like. The site stays static; these settings are public and
# reach every reader, so they never hold a credential. Empty base_url: off.
dynamic_services:
  base_url: ""
  api_version: v1
  timeout_ms: 8000
  credentials: omit        # or same-origin / include, for cookie-authenticated services
  features:
    corrections: true
    contact: true

# The correction-report form on posts: structured feedback to the author,
# through the dynamic services above. Labels for the categories live in
# _data/i18n under corrections.categories.
corrections:
  enabled: true
  categories:
    - mathematical-error
    - factual-error
    - citation
    - code
    - reproducibility
    - typo
    - accessibility
    - other

# The contact and collaboration form (a page with `contact_form: true`; the
# demo's /contact/): structured messages to the author through the dynamic
# services above. Without them the page shows contact_email instead.
contact:
  enabled: true
  categories:
    - research-collaboration
    - consulting
    - speaking
    - mentoring
    - reproducibility
    - media
    - other
  # prompts:                       # a prompt per category, over the ones in _data/i18n
  #   consulting: Say the scope, the budget range and when you need it.
  # privacy_notice: ""             # over contact.privacy in _data/i18n
  # retention: ""                  # e.g. Messages are deleted after a year.

# "Was this useful?" after every post: a reaction without a comment, through
# the dynamic services above. The counts are the service's own; none is invented.
reactions:
  enabled: true
  counts: true
  types:
    - useful
    - clear
    - interesting
    - needs-clarification

# Webmentions: links and replies from other websites. endpoint is the
# receiver advertised in every page's head (<link rel="webmention">); the
# mentions shown under a post are read through the dynamic services above.
# Empty: nothing is advertised, nothing is shown.
webmentions:
  enabled: true
  endpoint: ""
  types:                # mention, reply, repost, like: the kinds shown; likes are off by default
    - mention
    - reply

# Newsletter subscriptions through the dynamic services above: a compact form
# where placement says (footer, post), and /subscriptions/, the page the
# emails link to for confirming, changing topics and unsubscribing.
subscriptions:
  enabled: true
  double_opt_in: true   # the consent wording says a confirmation email comes first
  placement:
    - footer
  topics:               # optional; labels under subscriptions.topics in _data/i18n
    - new-articles
    - research-notes
    - datasets
  privacy_url: /privacy/

# The moderation inbox (docs/moderation.md): a page with moderation_inbox: true
# (the demo's /admin/moderation/) lists what the self-hosted features received
# and acts on it through the moderation API. Off by default. These settings are
# public and the page protects nothing: signing in and permissions are the
# service's, or an identity-aware proxy's, on every request. Never a password here.
moderation:
  enabled: false
  endpoint: ""            # only when the moderation API lives apart from dynamic_services.base_url
  credentials: include    # how the browser sends the moderator's session: include, same-origin or omit
  sign_in_url: ""         # where a moderator signs in; linked when the service answers 401

# -----------------------------------------------------------------------------
# DataLog Plugins
# -----------------------------------------------------------------------------
datalog_plugins:
  enabled:
    - datalog-search
    - datalog-citations
    - datalog-slides
    - datalog-comments
  options:
    datalog-citations:
      bibliography_title: References
    datalog-slides:
      cdn: https://unpkg.com/reveal.js@5
      width: 100%
      height: 620px
    datalog-comments:
      provider: giscus   # giscus, utterances, disqus, or api: the site's own backend (docs/components.md#comments)
      repo: DiogoRibeiro7/analytics-blog-jekyll
      repo_id: ""        # Get from https://giscus.app
      category: General
      category_id: ""    # Get from https://giscus.app
      mapping: pathname
      theme: light

# -----------------------------------------------------------------------------
# Analytics
# -----------------------------------------------------------------------------
analytics:
  ga4_property_id: ""
  ga4_credentials_path: ""

# -----------------------------------------------------------------------------
# Exclusions
# -----------------------------------------------------------------------------
exclude:
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
  - scripts
  - lib
  - docs
  - Gemfile
  - node_modules/
  - vendor/
  - .bundle/
  - lib/
  - bin/
  - datalog-theme.gemspec
  - "*.gemspec"
  - script/
  - tmp/
  - template/
  - tests/
  - CHANGELOG.md
  - CITATION.cff
  - CONTRIBUTING.md
  - SECURITY.md
  - TESTING.md
  - LICENSE
  - Dockerfile
  - Dockerfile.dev
  - docker-compose.yml
  - Rakefile
  - eslint.config.js
  - vitest.config.js
  - playwright.config.js
  - lighthouserc.json
  - pa11yci.json
  - package.json
  - package-lock.json
  - requirements.txt
  # Test and coverage artefacts: without these the Playwright HTML report and
  # the coverage report are copied into _site and published with the site.
  - playwright-report/
  - test-results/
  - coverage/

# -----------------------------------------------------------------------------
# Development
# -----------------------------------------------------------------------------
development:
  livereload: true
